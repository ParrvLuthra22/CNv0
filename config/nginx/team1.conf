upstream app_backends {
    server 10.7.25.71:3001 max_fails=2 fail_timeout=10s;
    server 10.7.25.71:3002 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.team1.test api.team1.test;

    ssl_certificate     /Users/parrvluthra/Documents/CNv0/config/tls/server.crt;
    ssl_certificate_key /Users/parrvluthra/Documents/CNv0/config/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
