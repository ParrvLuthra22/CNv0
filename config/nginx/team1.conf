upstream team1_backend {
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    server 10.7.12.88:3002 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name app.team1.test api.team1.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.team1.test api.team1.test;

    ssl_certificate /Users/parrvluthra/.certs/server.crt;
    ssl_certificate_key /Users/parrvluthra/.certs/server.key;

    location / {
        proxy_pass http://team1_backend;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
